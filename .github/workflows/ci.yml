name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / deno
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Software Vulkan adapter for the GPU tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: deno fmt --check src tests tools
      - run: deno lint src tests tools
      - run: deno task test
      - name: Embedded shader and WebAssembly kernel are current
        run: deno task embed && git diff --exit-code src/shader.ts src/stream_wasm.ts
  node:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
  bun:
    name: ubuntu-latest / bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun test tests/core.test.ts tests/cpu.test.ts tests/conformance.test.ts
  build:
    name: npm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
  shader:
    name: naga validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install naga-cli --locked
      - run: naga tandem.wgsl
      - run: cat tandem.wgsl tandem_f32.wgsl tandem_derived.wgsl > all.wgsl && naga all.wgsl
  vectors:
    name: vectors, conformance files and ziggurat tables are current
    runs-on: ubuntu-latest
    env:
      SPEC_PIN: 2a4bd08205596bc12bb7ae102862c97a0477dc2e
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: |
          git clone https://github.com/tandem-rng/spec ../tandem-spec
          git -C ../tandem-spec checkout --quiet "$SPEC_PIN"
          diff ../tandem-spec/vectors.json tests/vectors.json
          for f in ../tandem-spec/conformance/*.json; do cmp "$f" "tests/conformance/${f##*/}"; done
          diff <(cd ../tandem-spec/conformance && ls *.json) <(ls tests/conformance)
          deno run --allow-read --allow-write tools/gen_zig_tables.ts ../tandem-spec/tables/normal_f64_zig1024.json
          git diff --exit-code src/zig_tables.ts
